      bw.u16(0);
    }
    ctx.note(tris.length+' triangles');
    return bw.out();
  }

  /* ------------------------------------------------- glb (glTF binary) ------ */
  function glbWrite(vox, ctx){
    const b = vox.bbox(); const v = b ? vox.crop(b) : vox;
    const get=(x,y,z)=>v.get(x,y,z);
    const positions=[]; // float
    const colors=[]; // float r g b a
    const indices=[];

    const addQuad = (p0,p1,p2,p3, col)=>{
      const r=((col>>>16)&255)/255, g=((col>>>8)&255)/255, bl=(col&255)/255;
      const cvt = (p)=>[p[0], v.d - p[2], p[1]]; // X, Y-up, Z
      const base = positions.length/3;
      for (const p of [p0,p1,p2,p3]){
        const c=cvt(p);
        positions.push(c[0],c[1],c[2]);
        colors.push(r,g,bl,1.0);
      }
      indices.push(base, base+1, base+2, base, base+2, base+3);
    };

    for (let z=0;z<v.d;z++) for (let y=0;y<v.h;y++) for (let x=0;x<v.w;x++){
      const c=get(x,y,z); if (!c) continue;
      if (!get(x-1,y,z)) addQuad([x,y,z],[x,y,z+1],[x,y+1,z+1],[x,y+1,z], c);
      if (!get(x+1,y,z)) addQuad([x+1,y+1,z],[x+1,y+1,z+1],[x+1,y,z+1],[x+1,y,z], c);
      if (!get(x,y-1,z)) addQuad([x+1,y,z],[x+1,y,z+1],[x,y,z+1],[x,y,z], c);
      if (!get(x,y+1,z)) addQuad([x,y+1,z],[x,y+1,z+1],[x+1,y+1,z+1],[x+1,y+1,z], c);
      if (!get(x,y,z-1)) addQuad([x,y,z],[x,y+1,z],[x+1,y+1,z],[x+1,y,z], c);
      if (!get(x,y,z+1)) addQuad([x,y+1,z+1],[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1], c);
    }

    const posBytes = new Uint8Array(positions.length*4);
    const colBytes = new Uint8Array(colors.length*4);
    const idxCount = indices.length;
    const useU16 = (positions.length/3) < 65535;
    const idxBytes = new Uint8Array(idxCount*(useU16?2:4));

    const dvPos = new DataView(posBytes.buffer);
    for (let i=0;i<positions.length;i++) dvPos.setFloat32(i*4, positions[i], true);
    const dvCol = new DataView(colBytes.buffer);
    for (let i=0;i<colors.length;i++) dvCol.setFloat32(i*4, colors[i], true);
    const dvIdx = new DataView(idxBytes.buffer);
    if (useU16) for (let i=0;i<idxCount;i++) dvIdx.setUint16(i*2, indices[i], true);
    else for (let i=0;i<idxCount;i++) dvIdx.setUint32(i*4, indices[i], true);

    // align to 4
    const pad = (n)=> (4 - (n%4))%4;
    const posPad = pad(posBytes.length), colPad = pad(colBytes.length), idxPad = pad(idxBytes.length);
    const binLength = posBytes.length+posPad + colBytes.length+colPad + idxBytes.length+idxPad;

    const json = {
      asset:{version:"2.0", generator:"AoS voxel converter"},
      scene:0,
      scenes:[{nodes:[0]}],
      nodes:[{mesh:0}],
      meshes:[{primitives:[{attributes:{POSITION:0, COLOR_0:1}, indices:2, mode:4}]}],
      accessors:[
        {bufferView:0, componentType:5126, count:positions.length/3, type:"VEC3", max:[v.w, v.d, v.h], min:[0,0,0]},
        {bufferView:1, componentType:5126, count:colors.length/4, type:"VEC4"},
        {bufferView:2, componentType: useU16?5123:5125, count:idxCount, type:"SCALAR"}
      ],
      bufferViews:[
        {buffer:0, byteOffset:0, byteLength:posBytes.length},
        {buffer:0, byteOffset:posBytes.length+posPad, byteLength:colBytes.length},
        {buffer:0, byteOffset:posBytes.length+posPad+colBytes.length+colPad, byteLength:idxBytes.length}
      ],
      buffers:[{byteLength:binLength}],
      materials:[{pbrMetallicRoughness:{baseColorFactor:[1,1,1,1], metallicFactor:0, roughnessFactor:1}, doubleSided:true, vertexColors:true}]
    };
    // primitive material reference
    json.meshes[0].primitives[0].material = 0;

    const jsonText = JSON.stringify(json);
    const jsonBytes = new TextEncoder().encode(jsonText);
    const jsonPad = pad(jsonBytes.length);
    const totalLen = 12 + 8 + jsonBytes.length+jsonPad + 8 + binLength;

    const out = new BW(totalLen);
    out.u32(0x46546C67); // 'glTF'
    out.u32(2);
    out.u32(totalLen);
    // JSON chunk
    out.u32(jsonBytes.length+jsonPad);
    out.u32(0x4E4F534A);
    out.raw(jsonBytes);
    for (let i=0;i<jsonPad;i++) out.u8(0x20);
    // BIN chunk
    out.u32(binLength);
    out.u32(0x004E4942);
    out.raw(posBytes); for (let i=0;i<posPad;i++) out.u8(0);
    out.raw(colBytes); for (let i=0;i<colPad;i++) out.u8(0);
    out.raw(idxBytes); for (let i=0;i<idxPad;i++) out.u8(0);

    ctx.note((positions.length/3)+' verts, '+idxCount/3+' tris — imports directly in Blender, Unity, Godot');
    return out.out();
  }

  /* ------------------------------------------------- .ply (ascii) ------------ */
  function plyWrite(vox, ctx){
    const b = vox.bbox(); const v = b ? vox.crop(b) : vox;
    const verts=[];
    const get=(x,y,z)=>v.get(x,y,z);
    const addQuad = (p0,p1,p2,p3)=>{
      const cvt = (p)=>[p[0], v.d - p[2], p[1]];
      const base = verts.length;
      for (const p of [p0,p1,p2,p3]) verts.push(cvt(p));
      return [base, base+1, base+2, base+3];
    };
    const faces=[]; // {idx:[], color}
    for (let z=0;z<v.d;z++) for (let y=0;y<v.h;y++) for (let x=0;x<v.w;x++){
      const c=v.get(x,y,z); if (!c) continue;
      if (!get(x-1,y,z)){ const q=addQuad([x,y,z],[x,y,z+1],[x,y+1,z+1],[x,y+1,z]); faces.push({q:[q[0],q[1],q[2]], c}); faces.push({q:[q[0],q[2],q[3]], c}); }
      if (!get(x+1,y,z)){ const q=addQuad([x+1,y+1,z],[x+1,y+1,z+1],[x+1,y,z+1],[x+1,y,z]); faces.push({q:[q[0],q[1],q[2]], c}); faces.push({q:[q[0],q[2],q[3]], c}); }
      if (!get(x,y-1,z)){ const q=addQuad([x+1,y,z],[x+1,y,z+1],[x,y,z+1],[x,y,z]); faces.push({q:[q[0],q[1],q[2]], c}); faces.push({q:[q[0],q[2],q[3]], c}); }
      if (!get(x,y+1,z)){ const q=addQuad([x,y+1,z],[x,y+1,z+1],[x+1,y+1,z+1],[x+1,y+1,z]); faces.push({q:[q[0],q[1],q[2]], c}); faces.push({q:[q[0],q[2],q[3]], c}); }
      if (!get(x,y,z-1)){ const q=addQuad([x,y,z],[x,y+1,z],[x+1,y+1,z],[x+1,y,z]); faces.push({q:[q[0],q[1],q[2]], c}); faces.push({q:[q[0],q[2],q[3]], c}); }
      if (!get(x,y,z+1)){ const q=addQuad([x,y+1,z+1],[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1]); faces.push({q:[q[0],q[1],q[2]], c}); faces.push({q:[q[0],q[2],q[3]], c}); }
    }
    let header=[];
    header.push('ply');
    header.push('format ascii 1.0');
    header.push('comment Ace of Spades converter');
    header.push('element vertex '+verts.length);
    header.push('property float x'); header.push('property float y'); header.push('property float z');
    header.push('element face '+faces.length);
    header.push('property list uchar int vertex_indices');
    header.push('property uchar red'); header.push('property uchar green'); header.push('property uchar blue');
    header.push('end_header');
    let lines=header.slice();
    for (const vt of verts) lines.push(vt[0]+' '+vt[1]+' '+vt[2]);
    for (const f of faces){
      const c=f.c; const r=(c>>>16)&255, g=(c>>>8)&255, b=c&255;
      lines.push('3 '+f.q[0]+' '+f.q[1]+' '+f.q[2]+' '+r+' '+g+' '+b);
    }
    ctx.note(verts.length+' verts');
    return new TextEncoder().encode(lines.join('\n'));
  }

  /* ------------------------------------------------- schematic (MCEdit) ----- */
  const woolCols = [
    {id:35,data:0, rgb:[221,221,221]}, {id:35,data:1, rgb:[219,125,62]}, {id:35,data:2, rgb:[179,80,188]},
    {id:35,data:3, rgb:[107,138,201]}, {id:35,data:4, rgb:[177,166,39]}, {id:35,data:5, rgb:[65,174,56]},
    {id:35,data:6, rgb:[208,132,153]}, {id:35,data:7, rgb:[64,64,64]}, {id:35,data:8, rgb:[154,161,161]},
    {id:35,data:9, rgb:[46,110,137]}, {id:35,data:10, rgb:[126,61,181]}, {id:35,data:11, rgb:[46,56,141]},
    {id:35,data:12, rgb:[79,50,31]}, {id:35,data:13, rgb:[53,70,27]}, {id:35,data:14, rgb:[150,52,48]},
    {id:35,data:15, rgb:[25,22,22]}
  ];
  function nearestWool(col){
    const r=(col>>>16)&255,g=(col>>>8)&255,b=col&255;
    let best=0,bd=1e9;
    for (let i=0;i<woolCols.length;i++){
      const wc=woolCols[i].rgb;
      const dr=r-wc[0], dg=g-wc[1], db=b-wc[2];
      const d=dr*dr+dg*dg+db*db;
      if (d<bd){bd=d; best=i;}
    }
    return woolCols[best];
  }
  function nbtString(s){
    const eb=new TextEncoder().encode(s);
    const out=new Uint8Array(2+eb.length);
    out[0]=(eb.length>>8)&255; out[1]=eb.length&255; out.set(eb,2);
    return out;
  }
  function nbtTag(type, name, payload){
    const ns = nbtString(name);
    const out = new BW(1+ns.length+payload.length);
    out.u8(type); out.raw(ns); out.raw(payload);
    return out.out();
  }
  function nbtCompound(name, childrenBytes){
    const ns = nbtString(name);
    const out = new BW(1+ns.length+childrenBytes.length+1);
    out.u8(10); out.raw(ns); out.raw(childrenBytes); out.u8(0);
    return out.out();
  }
  // gzip wrapper using raw deflate from A
  function gzipWrap(raw){
    const bw=new BW(10+raw.length+8+64);
    bw.u8(0x1f); bw.u8(0x8b); bw.u8(8); bw.u8(0);
    bw.u32(0); // mtime
    bw.u8(0); bw.u8(255); // xfl, os
    // raw deflate
    const def = A.deflateRaw(raw);
    bw.raw(def);
    const crc = A.crc32(raw);
    bw.u32(crc); // crc32 LE
    bw.u32(raw.length); // isize LE
    return bw.out();
  }
  function schemWrite(vox, ctx){
    const b = vox.bbox(); const v = b ? vox.crop(b) : vox;
    const W=v.w, H=v.d, L=v.h; // Height = our depth
    const total = W*H*L;
    if (total> 16e6) throw new Error('schematic too large ('+W+'×'+H+'×'+L+')');
    const blocks = new Uint8Array(total);
    const dataArr = new Uint8Array(total);
    // order: (Y * L + Z)*W + X  where Y = height (0 bottom). Our z down: Y = H-1 - ourZ
    for (let z=0; z<v.d; z++){
      const Y = H-1 - z;
      for (let y=0;y<v.h;y++){
        const Z = y;
        for (let x=0;x<v.w;x++){
          const c=v.get(x,y,z); if (!c) continue;
          const idx = (Y*L + Z)*W + x;
          const wool = nearestWool(c);
          blocks[idx]=wool.id;
          dataArr[idx]=wool.data;
        }
      }
    }
    // build NBT compound
    const bw = new BW(total*2+256);
    const u32be = (v) => { bw.u8((v>>>24)&255); bw.u8((v>>>16)&255); bw.u8((v>>>8)&255); bw.u8(v&255); };
    // Width short
    bw.u8(2); let ns=nbtString('Width'); bw.raw(ns); bw.u8((W>>8)&255); bw.u8(W&255);
    bw.u8(2); ns=nbtString('Height'); bw.raw(ns); bw.u8((H>>8)&255); bw.u8(H&255);
    bw.u8(2); ns=nbtString('Length'); bw.raw(ns); bw.u8((L>>8)&255); bw.u8(L&255);
    // Materials
    bw.u8(8); ns=nbtString('Materials'); bw.raw(ns);
    let ms=nbtString('Alpha'); bw.raw(ms);
    // Blocks
    bw.u8(7); ns=nbtString('Blocks'); bw.raw(ns);
    u32be(total); bw.raw(blocks);
    // Data
    bw.u8(7); ns=nbtString('Data'); bw.raw(ns);
    u32be(total); bw.raw(dataArr);
    // Entities, TileEntities empty lists
    bw.u8(9); ns=nbtString('Entities'); bw.raw(ns); bw.u8(10); u32be(0);
    bw.u8(9); ns=nbtString('TileEntities'); bw.raw(ns); bw.u8(10); u32be(0);
    bw.u8(0); // end root compound content

    const rootName = nbtString('Schematic');
    const outRoot = new BW(1+rootName.length+bw.n);
    outRoot.u8(10); outRoot.raw(rootName); outRoot.raw(bw.out().subarray(0,bw.n));
    // Actually our bw already includes tags inside compound without outer type? We built inner tags directly, so wrap:
    // Simpler: create final raw NBT (compound named Schematic containing inner tags)
    // Our bw is inner payload, already ended with 0. So root is 10 + name + inner + 0? But inner already ends with 0.
    // To avoid double 0, we built correctly: root's payload = inner tags + END. We included END.
    // So final file is root tag: type 10, name 'Schematic', payload = inner
    // That is outRoot without extra 0 at end (inner already has its END).
    // The outRoot we just built includes type+name+inner (which ends with 0). So we should return that as raw NBT then gzip.

    const rawNBT = outRoot.out();
    const gz = gzipWrap(rawNBT);
    ctx.note('Mapped to wool (16 colours) — closest match per voxel. Size '+W+'×'+H+'×'+L);
    return gz;
  }

  /* ------------------------------ register all new formats ------------------- */
  const EXTRA = [
    {
      id:'vox_slab', name:'SLAB6 Vox', ext:'vox', blurb:'Ken Silverman SLAB6 raw .vox (xsiz/column palette)', limit:'256 colours, columns limited to 255 voxels (same as SLAB6). Shares .vox extension with MagicaVoxel — sniff decides.',
      sniff(u8){
        if (u8.length<12+768) return 0;
        const xs=rdU(u8,0), ys=rdU(u8,4), zs=rdU(u8,8);
        if (xs<=0||xs>1024||ys<=0||ys>1024||zs<=0||zs>256) return 0;
        // quick sanity: remaining bytes after header minus palette should be plausible
        const palOff = u8.length-768;
        let p=12, cols=xs*ys, ok=0;
        for (let i=0;i<cols && p<palOff;i++){
          if (p>=palOff) break;
          const cnt=u8[p++]; if (cnt>0 && p+cnt*3<=palOff){ p+=cnt*3; ok++; } else break;
        }
        return ok>0? (p===palOff?1.0:0.8):0;
      },
      read:slabRead, write:slabWrite
    },
    {
      id:'glb', name:'glTF Binary', ext:'glb', blurb:'glTF 2.0 binary — imports in Blender, Unity, Godot, Three.js with vertex colours',
      limit:'face-culled mesh with vertex colours, Y-up (model stands upright).',
      sniff(u8){ return u8.length>12 && u8[0]===0x67 && u8[1]===0x6C && u8[2]===0x54 && u8[3]===0x46 ? 1:0; },
      read(u8, ctx){ throw new Error('glb import not yet implemented — export only. Use .obj/.vox as bridge.'); },
      write:glbWrite
    },
    {
      id:'obj', name:'Wavefront OBJ', ext:'obj', blurb:'Wavefront .obj with vertex colours (Blender, Maya, etc.)',
      limit:'face-culled, Y-up, one object; colours in vertex colour extension.',
      sniff(u8){
        const t = new TextDecoder().decode(u8.subarray(0, Math.min(u8.length, 512)));
        return /^\s*v\s+-?\d/.test(t) && /f\s+\d/.test(t) ? 0.7:0;
      },
      read(u8, ctx){ throw new Error('OBJ import not implemented yet — use .vox/.qb/.kv6 as source.'); },
      write:objWrite
    },
    {
      id:'stl', name:'STL binary', ext:'stl', blurb:'Binary STL for 3D printing / slicing',
      limit:'no colours, face-culled triangles, Y-up.',
      sniff(u8){
        if (u8.length<84) return 0;
        // binary STL: header 80, then count
        const n = rdU(u8,80);
        return (u8.length===84+n*50)?0.9:0;
      },
      read(u8,ctx){ throw new Error('STL import not implemented — export only.'); },
      write:stlWrite
    },
    {
      id:'ply', name:'Stanford PLY', ext:'ply', blurb:'PLY ascii with per-face colours',
      limit:'ascii PLY, Y-up.',
      sniff(u8){
        const h = String.fromCharCode(...u8.subarray(0, Math.min(40,u8.length)));
        return h.startsWith('ply')?1:0;
      },
      read(u8,ctx){ throw new Error('PLY import not yet implemented.'); },
      write:plyWrite
    },
    {
      id:'schematic', name:'Minecraft Schematic', ext:'schematic', blurb:'MCEdit .schematic (classic) — maps voxels to wool',
      limit:'gzipped NBT, wool palette (16 colours), air for empty.',
      sniff(u8){
        // gzip magic + NBT root tag 0x0A + name 'Schematic'
        if (u8.length<10) return 0;
        if (u8[0]===0x1f && u8[1]===0x8b) return 0.6; // need inflate to be sure, treat as possible
        return 0;
      },
      read: async function(u8, ctx){
        // try gunzip then parse minimal NBT to extract blocks if possible — for now error with hint
        throw new Error('Schematic import needs NBT parser — export only for now. Build in MCEdit then convert via .vox.');
      },
      write:schemWrite
    },
    {
      id:'json', name:'Voxel JSON', ext:'json', blurb:'Simple JSON list [{x,y,z,color}] — for piqueserver scripts & tools',
      limit:'plain text, full colour.',
      sniff(u8){
        if (u8.length<2) return 0;
        const t = new TextDecoder().decode(u8.subarray(0, Math.min(u8.length, 200))).trim();
        return t.startsWith('{') && t.includes('voxels') ? 0.9 : (t.startsWith('[') ? 0.4 : 0);
      },
      read:jsonRead, write:jsonWrite
    }
  ];

  for (const f of EXTRA) A.register(f);

  // expose for debugging
  A.EXTRA_FORMATS = EXTRA;
})();

/* ---------------------------------------------------------------------------
   Faces of the converter: background, drag & drop, preview, conversion flow.
   Everything is inline so the page is a single file with no dependencies.
   --------------------------------------------------------------------------- */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const el = {};

  /* ---------------------------------------------------------------- state */
  const state = { file: null, format: null, vox: null, result: null, job: 0, preview: null };

  /* ------------------------------------------------------- the background ---
     Everything below is the background effect: a full screen fragment shader
     (Perlin noise "waves" that the pointer pushes around) followed by an 8x8
     ordered-dither pass that prints the halftone grid.  It is the effect the
     reference page runs on Three.js, rewritten here as plain WebGL so the file
     stays dependency free.  If WebGL is missing or the shader will not build,
     a small canvas dot field takes over instead. */
  const VERT = [
    'attribute vec2 aPos;',
    'void main() { gl_Position = vec4(aPos, 0.0, 1.0); }'
  ].join('\n');

  const FRAG = [
    'precision highp float;',
    'uniform vec2 resolution;',
    'uniform float time;',
    'uniform vec2 mousePos;',
    'uniform float mouseRadius;',
    'uniform vec3 colorA;',
    'uniform vec3 colorB;',
    'uniform sampler2D bayer;',
    'const int OCTAVES = 4;',
    'const float WAVE_SPEED = 0.05;',
    'const float WAVE_FREQ = 3.0;',
    'const float WAVE_AMP = 0.3;',
    'const float PIXEL_SIZE = 2.0;',
    'const float COLOR_NUM = 4.0;',
    '',
    'vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }',
    'vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }',
    'vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }',
    'vec2 fade2(vec2 t) { return t * t * t * (t * (t * 6.0 - 15.0) + 10.0); }',
    '',
    'float cnoise(vec2 P) {',
    '  vec4 Pi = floor(P.xyxy) + vec4(0.0, 0.0, 1.0, 1.0);',
    '  vec4 Pf = fract(P.xyxy) - vec4(0.0, 0.0, 1.0, 1.0);',
    '  Pi = mod289(Pi);',
    '  vec4 ix = Pi.xzxz;',
    '  vec4 iy = Pi.yyww;',
    '  vec4 fx = Pf.xzxz;',
    '  vec4 fy = Pf.yyww;',
    '  vec4 i = permute(permute(ix) + iy);',
    '  vec4 gx = fract(i * (1.0 / 41.0)) * 2.0 - 1.0;',
    '  vec4 gy = abs(gx) - 0.5;',
    '  vec4 tx = floor(gx + 0.5);',
    '  gx = gx - tx;',
    '  vec2 g00 = vec2(gx.x, gy.x);',
    '  vec2 g10 = vec2(gx.y, gy.y);',
    '  vec2 g01 = vec2(gx.z, gy.z);',
    '  vec2 g11 = vec2(gx.w, gy.w);',
    '  vec4 norm = taylorInvSqrt(vec4(dot(g00, g00), dot(g01, g01), dot(g10, g10), dot(g11, g11)));',
    '  g00 *= norm.x; g01 *= norm.y; g10 *= norm.z; g11 *= norm.w;',
    '  float n00 = dot(g00, vec2(fx.x, fy.x));',
    '  float n10 = dot(g10, vec2(fx.y, fy.y));',
    '  float n01 = dot(g01, vec2(fx.z, fy.z));',
    '  float n11 = dot(g11, vec2(fx.w, fy.w));',
    '  vec2 fade_xy = fade2(Pf.xy);',
    '  vec2 n_x = mix(vec2(n00, n01), vec2(n10, n11), fade_xy.x);',
    '  return 2.3 * mix(n_x.x, n_x.y, fade_xy.y);',
    '}',
    '',
    'float fbm(vec2 p) {',
    '  float value = 0.0;',
    '  float amp = 1.0;',
    '  for (int i = 0; i < OCTAVES; i++) {',
    '    value += amp * abs(cnoise(p));',
    '    p *= WAVE_FREQ;',
    '    amp *= WAVE_AMP;',
    '  }',
    '  return value;',
    '}',
    '',
    'float pattern(vec2 p) {',
    '  vec2 p2 = p - time * WAVE_SPEED;',
    '  return fbm(p + fbm(p2));',
    '}',
    '',
    'vec3 toSRGB(vec3 c) {',                       // the renderer encodes the finished frame
    '  vec3 lo = c * 12.92;',
    '  vec3 hi = 1.055 * pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055;',
    '  return mix(lo, hi, step(vec3(0.0031308), c));',
    '}',
    '',
    'void main() {',
    '  vec2 frag = gl_FragCoord.xy;',
    '  vec2 uv = frag / resolution.xy;',
    '  uv -= 0.5;',
    '  uv.x *= resolution.x / resolution.y;',
    '  float f = pattern(uv);',
    '  vec2 mouseNDC = (mousePos / resolution - 0.5) * vec2(1.0, -1.0);',
    '  mouseNDC.x *= resolution.x / resolution.y;',
    '  vec2 d = uv - mouseNDC;',
    '  float distSq = dot(d, d);',
    '  float effect = exp(-distSq / (mouseRadius * mouseRadius * 0.5));',
    '  f -= 2.5 * effect;',
    // two inks, as in the logo: a second, slower noise decides which of the pair each
    // region is printed in, so the field stays genuinely two tone (green blocks, red
    // lettering) instead of one averaged colour.  The wave field then sets how bright
    // that ink is, so both tones fall to black in the voids.
    '  vec2 pq = uv + vec2(11.3 + time * 0.010, -4.7 - time * 0.008);',
    '  float plate = fbm(pq * 1.5);',
    '  vec3 hue = plate > 0.5 ? colorB : colorA;',
    '  vec3 col = hue * pow(clamp(f * 1.15, 0.0, 1.0), 1.55);',
    // the reference dithers in a post pass: bayer 8x8, 4 levels, 2 px blocks
    '  vec2 coord = floor(frag / PIXEL_SIZE);',
    '  float threshold = texture2D(bayer, (mod(coord, 8.0) + 0.5) / 8.0).r - 0.25;',
    '  float steps = 1.0 / (COLOR_NUM - 1.0);',
    '  col = clamp(col + threshold * steps - 0.2, 0.0, 1.0);',
    '  col = floor(col * (COLOR_NUM - 1.0) + 0.5) / (COLOR_NUM - 1.0);',
    '  gl_FragColor = vec4(toSRGB(col), 1.0);',
    '}'
  ].join('\n');

  const BAYER8 = [0, 48, 12, 60, 3, 51, 15, 63, 32, 16, 44, 28, 35, 19, 47, 31, 8, 56, 4, 52, 11, 59, 7, 55,
    40, 24, 36, 20, 43, 27, 39, 23, 2, 50, 14, 62, 1, 49, 13, 61, 34, 18, 46, 30, 33, 17, 45, 29,
    10, 58, 6, 54, 9, 57, 5, 53, 42, 26, 38, 22, 41, 25, 37, 21];

  /* the two colours of the Ace of Spades logo, read straight off the artwork:
     #82a600 green and #f03505 red */
  const COLOR_A = [130 / 255, 166 / 255, 0];
  const COLOR_B = [240 / 255, 53 / 255, 5 / 255];
  const MOUSE_RADIUS = 0.175;              // 70% of the reference 0.25, so the dark blob is smaller

  function background() {
    const c = $('bg');
    let gl = null;
    try {
      gl = c.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false }) ||
           c.getContext('experimental-webgl');
    } catch (e) { gl = null; }
    if (gl && paintGL(gl, c)) return;
    fallbackField(c);                       // no WebGL (or a driver that refuses): use canvas 2d
  }

  function paintGL(gl, c) {
    const shader = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        if (window.console) console.warn('shader: ' + gl.getShaderInfoLog(s));
        return null;
      }
      return s;
    };
    const vs = shader(gl.VERTEX_SHADER, VERT), fs = shader(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return false;
    const prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      if (window.console) console.warn('program: ' + gl.getProgramInfoLog(prog));
      return false;
    }
    gl.useProgram(prog);
    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const tex = gl.createTexture();                        // the 8x8 bayer table
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, 8, 8, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, new Uint8Array(BAYER8));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    const u = {
      resolution: gl.getUniformLocation(prog, 'resolution'),
      time: gl.getUniformLocation(prog, 'time'),
      mousePos: gl.getUniformLocation(prog, 'mousePos'),
      mouseRadius: gl.getUniformLocation(prog, 'mouseRadius'),
      colorA: gl.getUniformLocation(prog, 'colorA'),
      colorB: gl.getUniformLocation(prog, 'colorB'),
      bayer: gl.getUniformLocation(prog, 'bayer')
    };
    gl.uniform1f(u.mouseRadius, MOUSE_RADIUS);
    gl.uniform3f(u.colorA, COLOR_A[0], COLOR_A[1], COLOR_A[2]);
    gl.uniform3f(u.colorB, COLOR_B[0], COLOR_B[1], COLOR_B[2]);
    gl.uniform1i(u.bayer, 0);

    const mouse = { x: -1e4, y: -1e4, tx: -1e4, ty: -1e4 };   // smoothed, in device pixels
    let dpr = 1;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(c.clientWidth * dpr));
      const h = Math.max(1, Math.round(c.clientHeight * dpr));
      if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
      gl.viewport(0, 0, w, h);
    }
    window.addEventListener('pointermove', (e) => {
      const r = c.getBoundingClientRect();
      mouse.tx = (e.clientX - r.left) * dpr;
      mouse.ty = (e.clientY - r.top) * dpr;
      if (mouse.x < -1e3) { mouse.x = mouse.tx; mouse.y = mouse.ty; }   // no jump on the first move
    }, { passive: true });
    window.addEventListener('pointerleave', () => { mouse.tx = -1e4; mouse.ty = -1e4; });

    const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const start = (window.performance && performance.now()) || Date.now();
    const now = () => ((window.performance && performance.now()) || Date.now()) - start;
    function frame() {
      resize();
      const t = still ? 12 : now() / 1000;
      mouse.x += (mouse.tx - mouse.x) * 0.12;                          // a little inertia
      mouse.y += (mouse.ty - mouse.y) * 0.12;
      gl.uniform2f(u.resolution, c.width, c.height);
      gl.uniform1f(u.time, t);
      gl.uniform2f(u.mousePos, mouse.x, mouse.y);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (still) return;
      requestAnimationFrame(frame);
    }
    window.addEventListener('resize', resize);
    frame();
    return true;
  }

  /* a small isometric dot field, used only when WebGL cannot run */
  function fallbackField(c) {
    const ctx = c.getContext('2d');
    let W = 0, H = 0, dpr = 1, tile = null, size = 260;
    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    function build() {
      const s = 34, rowH = s * Math.sin(Math.PI / 3), h = rowH * 0.5, w = s * 0.5;
      tile = document.createElement('canvas'); tile.width = tile.height = size;
      const g = tile.getContext('2d');
      g.fillStyle = 'rgba(130,166,0,0.30)';
      for (let y = 0; y < size + rowH; y += rowH) for (let x = 0; x < size + s; x += s) {
        const off = (Math.round(y / rowH) % 2) ? w : 0;
        g.beginPath(); g.arc(x + off, y, 1.1, 0, Math.PI * 2); g.fill();
      }
    }
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = c.clientWidth; H = c.clientHeight;
      c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      build();
    }
    let t0 = (window.performance && performance.now()) || 0;
    function frame(nowMs) {
      const t = ((nowMs || 0) - t0) / 1000;
      mouse.x += (mouse.tx - mouse.x) * 0.05; mouse.y += (mouse.ty - mouse.y) * 0.05;
      ctx.clearRect(0, 0, W, H);
      const pat = ctx.createPattern(tile, 'repeat');
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.translate(-(size / 2) + mouse.x * 16 + t * 6, -(size / 2) + mouse.y * 16 + t * 3);
      ctx.fillStyle = pat;
      ctx.fillRect(-size * 2, -size * 2, W + size * 4, H + size * 4);
      ctx.restore();
      requestAnimationFrame(frame);
    }
    window.addEventListener('pointermove', (e) => {
      mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
      mouse.ty = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });
    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  }

  /* --------------------------------------------------------- voxel preview */
  function preview(canvas, vox) {
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const box = canvas.parentElement.getBoundingClientRect();
    const W = Math.max(180, Math.min(620, Math.round(box.width - 2)));
    const H = Math.max(190, Math.min(440, Math.round(W * 0.78)));
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    let v = vox;
    const box0 = v.bbox();
    if (!box0) return { cancel() {} };
    v = v.crop(box0);
    /* big volumes are thinned until they are quick to draw, never dumped */
    for (let guard = 0; guard < 6 && v.countSolid() > 200000; guard++) {
      v = v.resample(Math.max(1, v.w >> 1), Math.max(1, v.h >> 1), Math.max(1, v.d >> 1));
    }
    const { w, h, d, cells } = v;
    const solid = (x, y, z) => x >= 0 && y >= 0 && z >= 0 && x < w && y < h && z < d && !!cells[x + w * (y + h * z)];

    /* --------------------------------------------------------------- framing
       A voxel covers a hexagon of 2s by 2s, so a model of w by h by d covers
       exactly (w+h)s across and ((w+h)/2 + d)s down. Sizing and centring by
       those two numbers keeps any shape — tall, flat or long — in the middle
       of the canvas and wholly inside it. */
    const s = Math.max(0.05, Math.min((W - 20) / (w + h), (H - 20) / ((w + h) * 0.5 + d)));
    const ox = W / 2 + (h - w) * s * 0.5;
    const oy = H / 2 - ((w + h) * 0.25 + d * 0.5) * s;
    const PX = (x, y) => ox + (x - y) * s;                 /* screen x of a grid corner */
    const PY = (x, y, z) => oy + ((x + y) * 0.5 + z) * s;  /* screen y of a grid corner */

    /* Draw order. The camera looks along (1,1,-1), so a voxel's distance from
       the eye is x+y-z, and painting far to near is exact: voxels that share a
       distance are never closer than touching, and anything nearer covers what
       is behind it. The old code sorted by x+y+z, which put the wrong voxel in
       front whenever a model ran diagonally — thin shapes came out shredded. */
    const order = [];
    for (let z = 0; z < d; z++) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!solid(x, y, z)) continue;
      order.push(x, y, z, x + y - z);
    }
    const seq = [];
    for (let n = 0; n < order.length; n += 4) seq.push(n);
    seq.sort((a, b) => order[a + 3] - order[b + 3] || (order[a + 2] - order[b + 2]));

    const rgb = (c, k) => 'rgb(' + (((c >>> 16) & 255) * k | 0) + ',' + (((c >>> 8) & 255) * k | 0) + ',' + ((c & 255) * k | 0) + ')';
    const rhombus = (x0, y0, x1, y1, x2, y2, x3, y3) => {
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
      ctx.closePath(); ctx.fill();
    };
    ctx.lineWidth = 0.7;
    ctx.strokeStyle = 'rgba(0,0,0,0.16)';

    for (const n of seq) {
      const x = order[n], y = order[n + 1], z = order[n + 2], c = cells[x + w * (y + h * z)];
      const X = PX(x, y), Y = PY(x, y, z);
      if (!solid(x, y, z - 1)) {                           /* roof */
        ctx.fillStyle = rgb(c, 1);
        rhombus(X, Y, X + s, Y + s * 0.5, X, Y + s, X - s, Y + s * 0.5);
        ctx.stroke();
      }
      if (!solid(x + 1, y, z)) {                           /* wall facing east */
        ctx.fillStyle = rgb(c, 0.72);
        rhombus(X + s, Y + s * 0.5, X + s, Y + s * 1.5, X, Y + s * 2, X, Y + s);
        ctx.stroke();
      }
      if (!solid(x, y + 1, z)) {                           /* wall facing south */
        ctx.fillStyle = rgb(c, 0.5);
        rhombus(X - s, Y + s * 0.5, X, Y + s, X, Y + s * 2, X - s, Y + s * 1.5);
        ctx.stroke();
      }
    }
  }
  const css = (c) => 'rgb(' + ((c >>> 16) & 255) + ',' + ((c >>> 8) & 255) + ',' + (c & 255) + ')';

  /* ------------------------------------------------------------ file input */
  function bindDrop() {
    const zone = $('drop');
    const open = () => $('file').click();
    zone.addEventListener('click', open);
    zone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    $('file').addEventListener('change', (e) => { if (e.target.files[0]) accept(e.target.files[0]); e.target.value = ''; });
    let depth = 0;
    const over = (on) => {
      document.body.classList.toggle('dragging', on);
      zone.classList.toggle('over', on);
    };
    window.addEventListener('dragenter', (e) => { e.preventDefault(); depth++; over(true); });
    window.addEventListener('dragover', (e) => { e.preventDefault(); });
    window.addEventListener('dragleave', (e) => { e.preventDefault(); if (--depth <= 0) { depth = 0; over(false); } });
    window.addEventListener('drop', (e) => {
      e.preventDefault(); depth = 0; over(false);
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) accept(f);
    });
  }

  async function accept(file) {
    const job = ++state.job;
    el.status.textContent = 'reading ' + file.name + '…';
    el.status.classList.remove('error');
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const res = await AOSC.readBytes(bytes);
      if (job !== state.job) return;
      state.file = file; state.vox = res.vox; state.format = res.format; state.result = null;
      el.status.textContent = '';
      show(res, file);
    } catch (e) {
      if (job !== state.job) return;
      fail(e.message || String(e));
    }
  }

  function fail(msg) {
    el.status.textContent = msg;
    el.status.classList.add('error');
  }

  function show(res, file) {
    const v = res.vox;
    el.panel.hidden = false;
    el.name.textContent = file.name;
    el.stats.innerHTML = stat('size', v.w + ' × ' + v.h + ' × ' + v.d) + stat('voxels', v.countSolid().toLocaleString()) +
      stat('colours', v.colors().length.toLocaleString());
    el.notes.innerHTML = (res.notes || []).map((n) => '<li>' + esc(n) + '</li>').join('');
    el.notes.hidden = !(res.notes && res.notes.length);
    el.mapScale.hidden = true;
    el.mapScaleLabel.hidden = true;
    // target list: everything except the format we read, with the lossy hint in the label
    el.target.innerHTML = AOSC.FORMATS.slice().sort((a, b) => a.id === state.format.id ? 1 : b.id === state.format.id ? -1 : 0)
      .map((f) => '<option value="' + f.id + '">.' + f.ext + '</option>').join('');
    el.target.value = 'kv6';
    updateTarget();
    el.panel.classList.remove('pop'); void el.panel.offsetWidth; el.panel.classList.add('pop');
    if (state.preview) state.preview.cancel();
    state.preview = raf(() => preview(el.canvas, v));
    requestAnimationFrame(() => el.panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' }));
  }
  const stat = (k, v) => '<div class="stat"><span>' + k + '</span><b>' + esc(String(v)) + '</b></div>';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const raf = (fn) => { const id = requestAnimationFrame(fn); return { cancel: () => cancelAnimationFrame(id) }; };

  function updateTarget() {
    el.mapScale.hidden = true;
    el.mapScaleLabel.hidden = true;
    el.convert.disabled = false;
    el.download.hidden = true;
    const fmt = AOSC.FORMATS.find((f) => f.id === el.target.value);
    const hint = fmt ? (fmt.limit || '') : '';
    el.warn.textContent = hint;
    el.warn.hidden = !hint;
  }

  async function convert() {
    if (!state.vox) return;
    const job = ++state.job;
    el.convert.classList.add('busy');
    el.convert.disabled = true;
    el.status.classList.remove('error');
    el.status.textContent = 'converting…';
    await new Promise((r) => setTimeout(r, 16));           // let the button paint
    try {
      const target = el.target.value;
      const opts = target === 'vxl' ? { scale: 'fit' } : {};
      const out = await AOSC.writeBytes(state.vox, target, opts);
      if (job !== state.job) return;
      state.result = out;
      const base = (state.file.name || 'model').replace(/\.[^.]+$/, '');
      const size = out.bytes.length < 1024 ? out.bytes.length + ' B' :
        out.bytes.length < 1048576 ? (out.bytes.length / 1024).toFixed(1) + ' KB' :
        (out.bytes.length / 1048576).toFixed(2) + ' MB';
      el.status.textContent = '';
      el.result.innerHTML = stat('result', size) + stat('format', '.' + out.ext);
      el.result.hidden = false;
      el.download.hidden = false;
      el.download.textContent = 'Download .' + out.ext;
      el.download.dataset.name = base + '.' + out.ext;
      el.onotes.innerHTML = (out.notes || []).map((n) => '<li>' + esc(n) + '</li>').join('');
      el.onotes.hidden = !(out.notes && out.notes.length);
      el.convert.classList.remove('busy');
      el.convert.disabled = false;
    } catch (e) {
      if (job !== state.job) return;
      el.convert.classList.remove('busy');
      el.convert.disabled = false;
      el.result.hidden = true;
      fail(e.message || String(e));
    }
  }

  function download() {
    if (!state.result) return;
    const blob = new Blob([state.result.bytes], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = el.download.dataset.name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }

  /* ------------------------------------------------------------------- init */
  function init() {
    for (const id of ['bg', 'drop', 'file', 'panel', 'name', 'stats', 'notes', 'canvas',
                      'target', 'mapScale', 'mapScaleLabel', 'convert', 'download', 'status', 'result', 'onotes', 'warn']) el[id] = $(id);
    background();
    bindDrop();
    el.convert.addEventListener('click', convert);
    el.target.addEventListener('change', updateTarget);
    el.download.addEventListener('click', download);
    el.panel.hidden = true;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !el.panel.hidden && document.activeElement === el.target) convert();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
